<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Настройки печати</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="btw">
      <nav class="nvg">
        <a href="index.html">Главная</a>
        <a href="page2.html">Настройки</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Настройки печати</h1>
    <p class="muted">
      Эти параметры применяются ко всем файлам при печати.
      Сохраняются в браузере автоматически.
    </p>

    <section class="settings-grid">
      <!-- Границы -->
      <div class="card">
        <h3>Границы таблицы</h3>

        <label>Цвет
          <input type="color" id="borderColor" />
        </label>

        <label>Толщина, px
          <input type="number" id="borderWidth" min="0" max="5" step="1" />
        </label>

        <label>Стиль
          <select id="borderStyle">
            <option value="solid">Сплошная</option>
            <option value="dashed">Пунктир</option>
            <option value="dotted">Точки</option>
            <option value="none">Без границ</option>
          </select>
        </label>
      </div>

      <!-- Текст -->
      <div class="card">
        <h3>Текст</h3>

        <label>Размер текста в таблице, px
          <input type="number" id="fontSize" min="6" max="30" step="1" />
        </label>

        <label>Размер заголовка листа, px
          <input type="number" id="titleSize" min="8" max="40" step="1" />
        </label>
      </div>

      <!-- Отступы ячеек -->
      <div class="card">
        <h3>Отступы в ячейках</h3>

        <label>Сверху/снизу, px
          <input type="number" id="padY" min="0" max="30" step="1" />
        </label>

        <label>Слева/справа, px
          <input type="number" id="padX" min="0" max="40" step="1" />
        </label>
      </div>

      <!-- Страница -->
      <div class="card">
        <h3>Страница</h3>

        <label>Формат
          <select id="pageSize">
            <option value="A4 portrait">A4 — книжная</option>
            <option value="A4 landscape">A4 — альбомная</option>
            <option value="A3 portrait">A3 — книжная</option>
            <option value="A3 landscape">A3 — альбомная</option>
          </select>
        </label>

        <label>Поля страницы, mm
          <input type="number" id="margin" min="0" max="30" step="1" />
        </label>
      </div>
    </section>

    <div class="settings-actions">
      <button id="saveBtn" class="btn btn-primary">Сохранить</button>
      <button id="resetBtn" class="btn btn-secondary">Сбросить по умолчанию</button>
      <span id="savedMsg" class="muted"></span>
    </div>
  </main>

  <script src="settings.js"></script>
  <script>
    const FIELDS = [
      'borderColor', 'borderWidth', 'borderStyle',
      'fontSize', 'titleSize',
      'padY', 'padX',
      'margin', 'pageSize'
    ];

    // Заполняем поля текущими настройками
    function fillForm() {
      const s = PrintSettings.load();
      FIELDS.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = s[id];
      });
    }

    // Собираем значения из формы
    function readForm() {
      const out = {};
      FIELDS.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.type === 'number') out[id] = Number(el.value);
        else out[id] = el.value;
      });
      return out;
    }

    // Автосохранение при любом изменении
    FIELDS.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', () => {
        PrintSettings.save(readForm());
        flashSaved();
      });
    });

    // Кнопка «Сохранить» (просто для явности)
    document.getElementById('saveBtn').addEventListener('click', () => {
      PrintSettings.save(readForm());
      flashSaved();
    });

    // Кнопка «Сбросить»
    document.getElementById('resetBtn').addEventListener('click', () => {
      PrintSettings.reset();
      fillForm();
      flashSaved('Сброшено');
    });

    let flashTimer = null;
    function flashSaved(text = 'Сохранено') {
      const el = document.getElementById('savedMsg');
      el.textContent = '✓ ' + text;
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { el.textContent = ''; }, 1500);
    }

    fillForm();
  </script>
</body>
</html>
